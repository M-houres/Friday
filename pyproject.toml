[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-agent"
version = "1.0.0"
description = "生产级 AI Agent 框架 —— 通用多智能体编排引擎"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Friday Team"}
]
keywords = ["ai", "agent", "llm", "orchestration", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
docker = ["aiodocker>=0.21.0"]
s3 = ["boto3>=1.34.0"]
jwt = ["PyJWT>=2.8.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]
all = [
    "friday-agent[docker,s3,jwt,dev]",
]

[project.urls]
Homepage = "https://github.com/anomalyco/friday"
Documentation = "https://github.com/anomalyco/friday"
Repository = "https://github.com/anomalyco/friday"

[project.scripts]
friday-new-app = "src.scaffold.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["tests*", "docs*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
